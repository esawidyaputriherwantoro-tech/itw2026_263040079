<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text Shado</title>
    <style>
        p {
      font-size: 28px;
      white-space: nowrap;
      width: 300px;
      background-color: lightblue;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      font-size: 100px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      text-shadow: 7px 8px 0 pink;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: lightblue;
      text-decoration-skip-ink: none;
    }
    </style>

</head>

<body>
    <h1>Hellow,CSS!</h1>
    <P>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque ad consequuntur perferendis minima aut sed assumenda totam, odio id delectus nam. Neque sit iusto quos reprehenderit molestiae voluptatum voluptatem beatae.</P>
    
</body>
</html>
