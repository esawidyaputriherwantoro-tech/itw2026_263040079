<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>CSS Simple Selectors</title>
</head>

<body>

  <h1 id="heading">Belajar Simple Selectors</h1>

  <h3>Judul Artikel 1</h3>
  <p>Paragraf biasa tanpa class.</p>

  <h3>Judul Artikel 2</h3>
  <p class="highlight">Paragraf ini diberi tanda stabilo menggunakan Class .highlight</p>
  <span class="highlight">Span ini juga pakai class .highlight</span>

  <hr>

  <form>
    <label>Nama (Input Teks):</label>
    <input type="text" name="nama" placeholder="Masukkan Nama">
    <br><br>
    <label>Password:</label>
    <input type="password" name="password">
  </form>

  <br>
