<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba element form di dalam tabel</title>
</head>
<body>
    <h1>Contoh elemen form di dalam tabel</h1>
    <table>
        <tr>
            <td align="right"><label for="nama">Nama:</label></td>
            <tb><input type="text" id="nama" name="nama" placeholder="Masukan nama"></tb>
        </tr>
        <tr>
            <td align="right"><label for="password">password:</label></td>
            <td><input type="email" id="email" name="email"></td>
        </tr>
        <tr>
            <td align="right"><label for="email">email:</label></td>
            <td><input type="email" id="email" name="email"></td>
        </tr>
        <tr>
            <td align="right"><label for="angka" name="angka">angka:</label></td>
            <td><input type="number" id="angka" name="angka"></td>
        </tr>
        <tr>
            <td align="right"><label for="tanggal">tanggal:</label></td>
            <td><input type="date" id="tanggal" name="tanggal"></td>
        </tr>
        <tr>
            <td align="right"><label for="warna">pilih warna:</label></td>
            <td><input type="color" id="warna" name="warna"></td>
        </tr>
        <tr>
            <td colspan="2"><button type="submit">submit:</button></td>
        </tr>
    </table>
    
</body>
</html>
